<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year 2026 Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div id="countdown-page" class="page-container">
        <div class="wrapper">
            <div class="heading">
                <h3>Countdown Till</h3>
                <h1>2026</h1>
            </div>
            <div class="countdown">
                <div class="box">
                    <span class="num" id="day-box">00</span>
                    <span class="text">Days</span>
                </div>
                <div class="box">
                    <span class="num" id="hr-box">00</span>
                    <span class="text">Hours</span>
                </div>
                <div class="box">
                    <span class="num" id="min-box">00</span>
                    <span class="text">Minutes</span>
                </div>
                <div class="box">
                    <span class="num" id="sec-box">00</span>
                    <span class="text">Seconds</span>
                </div>
            </div>
        </div>

        <button id="skip-button">SKIP COUNTDOWN</button>
    </div>

    <div id="animation-page" class="page-container hidden">
        <canvas id="Canvas"></canvas>

        <h1 class="celebration-text">HAPPY NEW YEAR 2026</h1>

        <div class="firework" id="firework1">
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
        </div>
        <div class="firework" id="firework2">
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
        </div>
        <div class="firework" id="firework3">
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
            <div class="cracker"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
